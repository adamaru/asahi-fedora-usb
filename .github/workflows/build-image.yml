name: Build Bootable USB Image

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: 'Target image size (e.g. 3700M for 4GB USB stick, 7500M for 8GB)'
        required: true
        default: '3700M'
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  build:
    name: Build USB Image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for aarch64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            arch-install-scripts \
            bubblewrap \
            btrfs-progs \
            dosfstools \
            e2fsprogs \
            gdisk \
            parted \
            python3-pefile \
            python3-pip \
            rsync \
            systemd-container \
            zstd \
            distribution-gpg-keys || true
          # Install dnf or dnf5 for mkosi cross-distribution bootstrap
          sudo apt-get install -y dnf || sudo apt-get install -y dnf5 || true
          # Install mkosi v26 and pefile system-wide so it is accessible in root PATH
          sudo python3 -m pip install --break-system-packages pefile "git+https://github.com/systemd/mkosi.git@v26"

      - name: Cache mkosi package cache
        uses: actions/cache@v6
        with:
          path: mkosi.cache
          key: mkosi-cache-f45-${{ hashFiles('mkosi.conf') }}
          restore-keys: |
            mkosi-cache-f45-

      - name: Build Bootable Image
        run: |
          sudo ./build-image.sh asahi-fedora-usb.raw ${{ github.event.inputs.image_size || '3700M' }}

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asahi-fedora-usb-image
          path: |
            asahi-fedora-usb.raw.zst
            asahi-fedora-usb.raw.zst.sha256
          retention-days: 14

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            asahi-fedora-usb.raw.zst
            asahi-fedora-usb.raw.zst.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            asahi-fedora-usb.raw.zst
            asahi-fedora-usb.raw.zst.sha256
